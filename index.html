<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Johnchefyboy's Club Staff Application</title>
  <script async src="https://tally.so/widgets/embed.js"></script>
  <style type="text/css">
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe { 
      position: absolute; 
      top: 0; 
      right: 0; 
      bottom: 0; 
      left: 0; 
      border: 0; 
      width: 100%; 
      height: 100%; 
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- YÖNLENDİRME/YÜKLENME EKRANI -->
  <div id="loading-container" class="loading-container">
    <h2>Discord'a yönlendiriliyorsunuz...</h2>
  </div>

  <div id="embed-container" class="hidden"></div>

  <script>
    const CLIENT_ID = '1538919776552882239'; 
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const TALLY_FORM_ID = '7R08La'; 

    const AUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;

    function getHashParams() {
      const hash = window.location.hash.substring(1);
      const params = {};
      hash.split('&').forEach(pair => {
        const [key, value] = pair.split('=');
        if (key) params[key] = decodeURIComponent(value);
      });
      return params;
    }

    async function init() {
      const params = getHashParams();

      // Eğer URL'de Discord'dan dönen access_token varsa kullanıcı verisini çek
      if (params.access_token) {
        try {
          const response = await fetch('https://discord.com/api/v10/users/@me', {
            headers: { authorization: `${params.token_type} ${params.access_token}` }
          });

          if (!response.ok) throw new Error('Oturum açma başarısız.');

          const user = await response.json();
          renderTallyEmbed(user);

        } catch (error) {
          console.error('Hata:', error);
          alert('Discord doğrulaması başarısız oldu. Tekrar yönlendiriliyorsunuz...');
          window.location.href = AUTH_URL;
        }
      } else {
        // Oturum açılmamışsa beklemeden direkt Discord Auth sayfasına yönlendir
        window.location.href = AUTH_URL;
      }
    }

    function renderTallyEmbed(user) {
      document.getElementById('loading-container').classList.add('hidden');
      
      const embedContainer = document.getElementById('embed-container');
      embedContainer.classList.remove('hidden');

      const src = `https://tally.so/r/${TALLY_FORM_ID}?What's%20your%20Discord%20ID%3F=${user.id}&What's%20your%20Discord%20username%3F=${encodeURIComponent(user.username)}`;
      
      embedContainer.innerHTML = `
        <iframe 
          data-tally-src="${src}" 
          width="100%" 
          height="100%" 
          frameborder="0" 
          marginheight="0" 
          marginwidth="0" 
          title="Johnchefyboy's Club Staff Application">
        </iframe>
      `;

      if (window.Tally) {
        window.Tally.loadEmbeds();
      }
    }

    init();
  </script>
</body>
</html>
